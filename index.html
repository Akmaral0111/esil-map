<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>ГИС Есильский район — Стабильный Маршрут</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.css" />
    <script src="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.js"></script>

    <style>
        body, html { margin: 0; padding: 0; height: 100%; font-family: sans-serif; }
        #map { width: 100%; height: 100%; background: #ffffff; } /* Белый фон для карты, когда подложка отключена */
        #panel {
            position: absolute; top: 20px; left: 20px;
            background: white; padding: 20px; border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3); z-index: 1000; max-width: 320px;
        }
        h3 { margin-top: 0; color: #0044aa; }
        .info { font-size: 13px; color: #555; }
        .layer-toggle {
            margin-top: 15px;
            padding: 10px;
            background: #f0f4f8;
            border-radius: 6px;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
        }
        .layer-toggle input { cursor: pointer; }
        /* Прячем стандартную текстовую инструкцию Leaflet, оставляем только красивую линию */
        .leaflet-routing-container { display: none; }
    </style>
</head>
<body>

    <div id="panel">
        <h3>ГИС Есильский район</h3>
        <p class="info">Построение точного автодорожного маршрута между объектами eGov.</p>
        <hr>
        
        <label class="layer-toggle">
            <input type="checkbox" id="toggle-osm" checked>
            <span>Показывать карту-подложку</span>
        </label>
        
        <hr>
        <p><strong>Инструкция:</strong> Кликните по двум точкам для построения маршрута по дорожной сети.</p>
        <div id="route-result">Слои успешно загружены!</div>
    </div>

    <div id="map"></div>

    <script>
        // Центрируем карту на Есильском районе
        var map = L.map('map').setView([51.1110, 71.4305], 14);

        // Создаем слой базовой карты OpenStreetMap
        var osmLayer = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OpenStreetMap'
        }).addTo(map); // По умолчанию добавляем её на карту

        var routingControl = null;
        var startLatLng = null;
        var endLatLng = null;

        // Логика работы переключателя подложки
        document.getElementById('toggle-osm').addEventListener('change', function(e) {
            if (e.target.checked) {
                map.addLayer(osmLayer); // Включаем карту-подложку обратно
            } else {
                map.removeLayer(osmLayer); // Полностью убираем подложку, оставляя белый экран
            }
        });

        // 1. Загрузка твоих фиолетовых дорог из QGIS для визуального контроля
        fetch('roads.geojson')
            .then(response => response.json())
            .then(data => {
                L.geoJSON(data, {
                    style: { color: '#8800ff', weight: 3, opacity: 0.4 }
                }).addTo(map);
                console.log("Твои дороги отображены!");
            })
            .catch(err => console.error("Ошибка загрузки дорог:", err));

        // 2. Загрузка твоих оранжевых точек eGov
        fetch('points.geojson')
            .then(response => response.json())
            .then(data => {
                L.geoJSON(data, {
                    pointToLayer: function (feature, latlng) {
                        return L.circleMarker(latlng, {
                            radius: 6, fillColor: "#ff4400", color: "#fff", weight: 1, opacity: 1, fillOpacity: 0.8
                        });
                    },
                    onEachFeature: function (feature, layer) {
                        var address = feature.properties.full_path_rus || "Адрес не указан";
                        layer.bindPopup(`<b>Адрес:</b> ${address}`);
                        layer.on('click', function(e) { handleRouteSelection(e.latlng); });
                    }
                }).addTo(map);
                console.log("Твои точки загружены!");
            })
            .catch(err => {
                document.getElementById('route-result').innerHTML = 
                    `<b style="color:red;">Ошибка загрузки данных! Проверьте локальный сервер.</b>`;
            });

        // Логика выбора точек кликом
        function handleRouteSelection(latlng) {
            if (!startLatLng) {
                startLatLng = latlng;
                document.getElementById('route-result').innerHTML = 'Точка А выбрана. Выберите точку Б.';
            } else if (!endLatLng) {
                endLatLng = latlng;
                buildRoute(startLatLng, endLatLng);
            } else {
                // Сброс при третьем клике
                startLatLng = latlng;
                endLatLng = null;
                if (routingControl) map.removeControl(routingControl);
                document.getElementById('route-result').innerHTML = 'Точка А выбрана заново. Выберите точку Б.';
            }
        }

        // Построение извилистого дорожного маршрута (OSRM работает всегда)
        function buildRoute(start, end) {
            if (routingControl) map.removeControl(routingControl);

            routingControl = L.Routing.control({
                waypoints: [
                    L.latLng(start.lat, start.lng),
                    L.latLng(end.lat, end.lng)
                ],
                router: L.Routing.osrmv1({
                    serviceUrl: 'https://router.project-osrm.org/route/v1' 
                }),
                lineStyle: {
                    styles: [{ color: '#0066ff', opacity: 0.85, weight: 6 }]
                },
                createMarker: function() { return null; } 
            }).addTo(map);

            // Выводим информацию о завершении
            routingControl.on('routesfound', function(e) {
                var routes = e.routes;
                var summary = routes[0].summary;
                var distanceKm = (summary.totalDistance / 1000).toFixed(2);
                
                document.getElementById('route-result').innerHTML = `
                    <p style="color:green;"><b>Маршрут успешно построен!</b></p>
                    <p>🛣️ <b>Расстояние по дорогам:</b> ${distanceKm} км</p>
                `;
            });
        }
    </script>
</body>
</html>
